name: Build and Deploy

# 2026-08-21: 배포를 여기로 되돌렸다. 모노레포로 옮겨 두니 web은 여전히
# nn98/delivery-discount-web에서 Vercel로 나가고 api만 모노에서 나가서,
# 양쪽 저장소에 서로 다른 "뒤처진 사본"이 하나씩 생겼다 — 하루에 두 번
# 벌어졌고 그중 하나는 문서가 코드보다 앞서 있었다.
#
# 모노레포 쪽 deploy-api.yml은 수동 폴백으로만 남겼다. 둘 다 push로
# 배포하면 같은 서버에 경쟁 배포가 된다.
#
# 2026-09-03: 같은 이름 jar를 그 자리에서 덮어쓰던 걸 버전 붙은 파일 +
# 심볼릭 링크 교체로 바꿨다. 예전 방식은 헬스체크가 실패해도 원본이
# 이미 덮여 있어 되돌릴 게 없었다 — 실패하면 재빌드뿐이었다. 이제
# 배포마다 새 파일로 남고, `current.jar` 링크만 원자적으로 옮긴다.
# 헬스체크 실패 시 링크를 이전 파일로 되돌리고 재시작한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      DEPLOY_DIR: /home/ubuntu/delivery-discount-api/build/libs
    steps:
      - uses: actions/checkout@v4

      - name: Build (includes tests)
        run: ./gradlew build

      - name: Record current version (rollback 대상)
        run: |
          mkdir -p "$DEPLOY_DIR"
          PREV=$(readlink -f "$DEPLOY_DIR/current.jar" 2>/dev/null || true)
          echo "PREV_JAR=$PREV" >> "$GITHUB_ENV"

      - name: Deploy (임시 인스턴스 교대, 무중단)
        # 2026-10-28: 재시작 때 약 5초 끊기던 것을 없앴다. 임시 인스턴스(8089)를 먼저 띄우고 그 사이 본 인스턴스를
        # 교체한다. 헬스체크, 롤백, jar 정리는 스크립트가 한다(mono api/deploy/prod/README.md). 종료 코드가 0이 아니면
        # 이 단계가 실패해 아래 슬랙 알림이 나간다(1 임시 인스턴스 안 뜸, 2 이전 jar로 복구, 3 수동 확인).
        run: |
          SHA=$(git rev-parse --short HEAD)
          NEW_JAR="$DEPLOY_DIR/delivery-discount-api-$SHA.jar"
          cp build/libs/delivery-discount-api-0.0.1.jar "$NEW_JAR"
          python3 deploy/prod/stage_deploy.py "$NEW_JAR" --deploy-dir "$DEPLOY_DIR"

      - name: 실패를 슬랙 채널로 (mono docs/design/26-ops-monitoring.md)
        if: failure()
        env:
          SLACK_OPS_TOKEN: ${{ secrets.SLACK_OPS_TOKEN }}
          SLACK_OPS_CHANNEL: ${{ secrets.SLACK_OPS_CHANNEL }}
        run: |
          [ -n "$SLACK_OPS_TOKEN" ] || { echo "SLACK_OPS_TOKEN 없음 - 알림 생략"; exit 0; }
          TEXT="❌ GitHub Actions 실패: ${{ github.workflow }} (${{ github.repository }}, ${GITHUB_SHA::7})"$'\n'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(TEXT="$TEXT" python3 -c 'import json,os;print(json.dumps({"channel":os.environ["SLACK_OPS_CHANNEL"],"text":os.environ["TEXT"]}))')
          curl -s -X POST https://slack.com/api/chat.postMessage -H "Authorization: Bearer $SLACK_OPS_TOKEN" -H "Content-type: application/json; charset=utf-8" --data "$BODY"
