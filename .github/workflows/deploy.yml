name: Build and Deploy

# 2026-08-21: 배포를 여기로 되돌렸다. 모노레포로 옮겨 두니 web은 여전히
# nn98/delivery-discount-web에서 Vercel로 나가고 api만 모노에서 나가서,
# 양쪽 저장소에 서로 다른 "뒤처진 사본"이 하나씩 생겼다 — 하루에 두 번
# 벌어졌고 그중 하나는 문서가 코드보다 앞서 있었다.
#
# 모노레포 쪽 deploy-api.yml은 수동 폴백으로만 남겼다. 둘 다 push로
# 배포하면 같은 서버에 경쟁 배포가 된다.
#
# 2026-09-03: 같은 이름 jar를 그 자리에서 덮어쓰던 걸 버전 붙은 파일 +
# 심볼릭 링크 교체로 바꿨다. 예전 방식은 헬스체크가 실패해도 원본이
# 이미 덮여 있어 되돌릴 게 없었다 — 실패하면 재빌드뿐이었다. 이제
# 배포마다 새 파일로 남고, `current.jar` 링크만 원자적으로 옮긴다.
# 헬스체크 실패 시 링크를 이전 파일로 되돌리고 재시작한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      DEPLOY_DIR: /home/ubuntu/delivery-discount-api/build/libs
    steps:
      - uses: actions/checkout@v4

      - name: Build (includes tests)
        run: ./gradlew build

      - name: Record current version (rollback 대상)
        run: |
          mkdir -p "$DEPLOY_DIR"
          PREV=$(readlink -f "$DEPLOY_DIR/current.jar" 2>/dev/null || true)
          echo "PREV_JAR=$PREV" >> "$GITHUB_ENV"

      - name: Deploy new jar
        run: |
          SHA=$(git rev-parse --short HEAD)
          NEW_JAR="$DEPLOY_DIR/delivery-discount-api-$SHA.jar"
          cp build/libs/delivery-discount-api-0.0.1.jar "$NEW_JAR"
          ln -sfn "$NEW_JAR" "$DEPLOY_DIR/current.jar"
          echo "NEW_JAR=$NEW_JAR" >> "$GITHUB_ENV"
          sudo systemctl restart delivery-discount-api.service

      - name: Health check
        run: |
          sleep 5
          curl -sf http://localhost:8088/api/brands -o /dev/null

      - name: Rollback on failed health check
        if: failure()
        run: |
          if [ -n "$PREV_JAR" ]; then
            echo "헬스체크 실패 — 이전 jar로 되돌린다: $PREV_JAR"
            ln -sfn "$PREV_JAR" "$DEPLOY_DIR/current.jar"
            sudo systemctl restart delivery-discount-api.service
          else
            echo "이전 jar 기록이 없다(첫 배포이거나 빌드 단계 실패) — 수동 확인 필요"
          fi

      - name: Prune old jars (최근 3개만 남긴다)
        if: success()
        run: |
          ls -t "$DEPLOY_DIR"/delivery-discount-api-*.jar 2>/dev/null \
            | grep -vF "$NEW_JAR" \
            | tail -n +3 \
            | xargs -r rm -f
