name: Check API

# 읽기 전용 검증만 한다. 배포 권한이 있는 self-hosted 러너(deploy.yml)에는
# pull_request 트리거를 연결하지 않는다 — 공개 저장소라 포크 PR이 운영 서버에서
# 코드를 돌릴 수 있게 된다.
#
# 2026-09-29까지 mono `check-api.yml`이 하던 일이다. 이 저장소가 정본이 되면서 옮겼다.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test
        run: ./gradlew test
      # 테스트는 앞 단계에서 통과했다. build가 같은 테스트를 다시 돌리지 않게 하고
      # 컴파일과 패키징 실패를 따로 드러낸다.
      - name: Build
        run: ./gradlew build -x test
